[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "laya-mlx-http"
version = "0.1.1"
description = "HTTP server that serves laya-mlx typed decision models over your LAN"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
keywords = ["laya", "mlx", "apple-silicon", "local-ai", "decision-model", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "laya-mlx>=0.2,<1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/noahwaldner/laya-mlx-http"
Repository = "https://github.com/noahwaldner/laya-mlx-http"
Issues = "https://github.com/noahwaldner/laya-mlx-http/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
laya-mlx-http = "laya_mlx_http.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_mlx_http"]

[tool.pytest.ini_options]
testpaths = ["tests"]
