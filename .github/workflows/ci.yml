name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python (pytest)
    # Apple silicon runner: the laya-mlx dependency pulls mlx only on macOS/arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'

      - name: Install
        run: |
          uv venv
          uv pip install -e './python[dev]' --python .venv/bin/python

      - name: Check version sync
        run: python3 scripts/versions.py check

      - name: Test
        run: .venv/bin/python -m pytest python/tests

      - name: Build sdist + wheel
        run: uv build --out-dir dist python

  node:
    name: node (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-provider
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: true
          cache-dependency-path: ai-provider/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run type-check

      - name: Pack preview
        run: npm pack --dry-run
